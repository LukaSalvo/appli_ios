name: Deploy → TestFlight (mise à jour iPhone)

# -----------------------------------------------------------------------------
# Ce workflow construit l'app signée et l'envoie sur TestFlight.
# Résultat concret : à chaque push validé sur `main`, tu reçois une notification
# TestFlight sur ton iPhone → un tap sur « Mettre à jour » et la nouvelle
# version est installée. C'est le plus proche possible d'une "mise à jour
# directe" autorisée par Apple pour une app grand public.
#
# ⚠️ IL NE FONCTIONNE QUE SI TU AS CONFIGURÉ LES SECRETS CI-DESSOUS.
# Tant qu'ils sont absents, le job s'arrête proprement (il ne casse rien).
#
# Prérequis (compte Apple Developer payant requis) :
#   1. Compte Apple Developer (99 $/an) + l'app créée sur App Store Connect
#      avec le bundle id : com.lukasalvo.paytracker
#   2. Une clé API App Store Connect (Users and Access → Integrations → Keys) :
#      fichier .p8, Key ID, Issuer ID.
#   3. Un certificat de distribution (.p12) + son mot de passe, et un
#      provisioning profile App Store.
#
# Secrets à créer dans : Settings → Secrets and variables → Actions
#   ASC_KEY_ID              : Key ID de la clé App Store Connect
#   ASC_ISSUER_ID           : Issuer ID
#   ASC_KEY_P8              : contenu du fichier .p8 (le texte entier)
#   BUILD_CERTIFICATE_P12   : certificat .p12 encodé en base64
#   P12_PASSWORD            : mot de passe du .p12
#   PROVISIONING_PROFILE    : profil .mobileprovision encodé en base64
#   KEYCHAIN_PASSWORD       : un mot de passe libre (temporaire, au choix)
#
# Astuce pour encoder en base64 (sur ton Mac) :
#   base64 -i certificat.p12 | pbcopy
#   base64 -i profil.mobileprovision | pbcopy
# -----------------------------------------------------------------------------

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-testflight
  cancel-in-progress: false

jobs:
  verifier_secrets:
    name: Vérifier la présence des secrets Apple
    runs-on: ubuntu-latest
    outputs:
      pret: ${{ steps.check.outputs.pret }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.ASC_KEY_ID }}" ] \
             && [ -n "${{ secrets.ASC_ISSUER_ID }}" ] \
             && [ -n "${{ secrets.ASC_KEY_P8 }}" ] \
             && [ -n "${{ secrets.BUILD_CERTIFICATE_P12 }}" ] \
             && [ -n "${{ secrets.PROVISIONING_PROFILE }}" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
            echo "Secrets Apple présents : le déploiement va s'exécuter."
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Apple absents — déploiement TestFlight ignoré."
            echo "::notice::Ajoute les secrets décrits en tête de ce fichier pour l'activer."
          fi

  deploy:
    name: Build signé & upload TestFlight
    needs: verifier_secrets
    if: needs.verifier_secrets.outputs.pret == 'true'
    runs-on: macos-14
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Sélectionner Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Installer XcodeGen & xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Importer le certificat et le provisioning profile
        env:
          BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          # Décoder les secrets base64 vers des fichiers.
          echo -n "$BUILD_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          # Créer une keychain temporaire et y importer le certificat.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Installer le provisioning profile.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Préparer la clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Numéro de build unique (basé sur le run)
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archiver l'application
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PayTracker.xcodeproj \
            -scheme PayTracker \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/PayTracker.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            | xcbeautify

      - name: Générer les options d'export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>generateAppStoreInformation</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Exporter & envoyer sur TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PayTracker.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify
          echo "✅ Build envoyé sur TestFlight — tu vas recevoir la notif sur ton iPhone."

      - name: Nettoyer les secrets déchiffrés
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
