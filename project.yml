name: PayTracker
options:
  bundleIdPrefix: com.lukasalvo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PayTracker:
    type: application
    platform: iOS
    sources:
      - PayTracker
    info:
      path: PayTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: "Paie Horaire"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukasalvo.paytracker
        PRODUCT_NAME: "Paie Horaire"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
