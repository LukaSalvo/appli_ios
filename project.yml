name: PayTracker
options:
  bundleIdPrefix: com.lukasalvo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PayTracker:
    type: application
    platform: iOS
    sources:
      - PayTracker
      - Shared
    info:
      path: PayTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: "Paie Horaire"
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: "L'accès à votre calendrier permet d'importer votre emploi du temps d'alternance (jours d'école et d'entreprise)."
        NSCalendarsUsageDescription: "L'accès à votre calendrier permet d'importer votre emploi du temps d'alternance (jours d'école et d'entreprise)."
        NSMicrophoneUsageDescription: "Le micro permet de décrire votre journée ou de dicter vos heures à voix haute."
        NSSpeechRecognitionUsageDescription: "La reconnaissance vocale, sur votre iPhone, transforme votre voix en horaires de travail."
        NSFaceIDUsageDescription: "Face ID verrouille l'accès à votre paie, votre solde et vos dépenses."
        # L'app n'embarque aucun chiffrement propre et n'utilise que celui d'iOS :
        # déclaré ici pour éviter la question à chaque envoi sur App Store Connect.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukasalvo.paytracker
        PRODUCT_NAME: "Paie Horaire"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PayTrackerWidgets
        embed: true

  PayTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PayTrackerWidgets
      - Shared
    info:
      path: PayTrackerWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Paie Horaire"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukasalvo.paytracker.widgets
        PRODUCT_NAME: PayTrackerWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
